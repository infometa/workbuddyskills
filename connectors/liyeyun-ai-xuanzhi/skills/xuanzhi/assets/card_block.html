<!--CARD-->
  <div class="card">
    <div class="thumb">{{LINK_OPEN}}<img src="{{IMG}}" alt="{{NAME}}">{{LINK_CLOSE}}
      <span class="tag-type">{{CTYPE}}</span>
      <span class="tag-badge">{{BADGE}}</span>
    </div>
    <div class="body">
      <h3>{{NAME}}</h3>
      <p class="addr">{{ADDR}}</p>
      <div class="metrics">
        <div class="metric"><span class="mk">{{M1K}}</span><span class="mv">{{M1V}}<em>{{M1S}}</em></span></div>
        <div class="metric"><span class="mk">{{M2K}}</span><span class="mv">{{M2V}}<em>{{M2S}}</em></span></div>
        <div class="metric"><span class="mk">{{M3K}}</span><span class="mv">{{M3V}}<em>{{M3S}}</em></span></div>
      </div>
      <div class="chips">{{CHIPS}}</div>
      <p class="remark">{{REMARK}}</p>
      <div class="broker">
        <div class="avatar">{{AVATAR}}</div>
        <div class="bwrap">
          <p class="bn">{{BNAME}}<em>· {{BAGE}}</em></p>
          <span class="bp">{{BPHONE}}</span>
        </div>
      </div>
    </div>
  </div>
<!--/CARD-->
