<!--CARD-->
  <div class="card">
    <div class="body">
      <div class="hd">
        <div class="thumb-sm">{{LINK_OPEN}}<img src="{{THUMB}}" alt="{{NAME}}">{{LINK_CLOSE}}</div>
        <div class="hdtx">
          <div class="hdrow"><span class="pill pill-type">{{CTYPE}}</span><span class="pill pill-badge">{{BADGE}}</span></div>
          <h3>{{NAME}}</h3>
          <p class="addr">{{ADDR}}</p>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><span class="mk">{{M1K}}</span><span class="mv">{{M1V}}<em>{{M1S}}</em></span></div>
        <div class="metric"><span class="mk">{{M2K}}</span><span class="mv">{{M2V}}<em>{{M2S}}</em></span></div>
        <div class="metric"><span class="mk">{{M3K}}</span><span class="mv">{{M3V}}<em>{{M3S}}</em></span></div>
      </div>
      <div class="chips">{{CHIPS}}</div>
      <p class="remark">{{REMARK}}</p>
      <div class="broker">
        <div class="avatar">{{AVATAR}}</div>
        <div class="bwrap">
          <p class="bn">{{BNAME}}<em>· {{BAGE}}</em></p>
          <span class="bp">{{BPHONE}}</span>
        </div>
      </div>
    </div>
  </div>
<!--/CARD-->
