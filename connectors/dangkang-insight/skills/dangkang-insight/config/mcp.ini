# ============================================================
# dangkang-insight —— 网关 MCP 对接配置
# 说明：本技能所有业务接口均经 MCP 网关调用，不再直连平台 OpenAPI，
#       因此**不需要 AK/SK**，也不需要 gmssl。
#       被测企业信息（电子税务局登录信息）属业务输入，运行时通过命令行传入。
# ============================================================

[mcp]
# 网关 MCP 入口（streamable HTTP / JSON-RPC 2.0）
url = https://lxyq.cssyq.com.cn/ggyw/mcp
# 单次 MCP 调用超时（秒）
timeout = 60

# ---- 令牌与自动续期 ----
# 脚本会在调用前检查令牌、遇到 401 时自动用 refresh_token 换新，并把结果写入
# config/.token.json（已被 .gitignore 忽略），下次运行直接复用。
# 也可用环境变量 DKI_MCP_TOKEN / DKI_MCP_REFRESH_TOKEN 覆盖，避免令牌落盘。
access_token =
# 刷新令牌。必须与「签发它的 client_id」成对使用，
# 否则网关报 invalid_grant: refresh_token 与客户端不匹配。
refresh_token =
# 签发上面令牌的 OAuth 客户端 ID（DCR 注册得到，形如 wb_xxxxxxxx）
client_id =
# 令牌端点；留空则自动从 url 推导：.../ggyw/mcp → .../ggyw/oauth2/token
token_endpoint =

# ---- 平台直连兜底（可选）----
# ⚠️ 上架基线：市场包内必须保持 false。连接器通道只走 MCP，不应保留绕过网关
#    直连平台公网域的路径；仅当网关侧登录态映射尚未修复时，才由内部排障临时打开。
#
# 网关把 yfp-ggyw 系接口（sys-user-info / riskdet-get-qrcode / riskdet-sms-code-* /
# riskdet-report-apply）转发到内网服务时若丢失平台登录态，会返回「401 账号未登录」。
# 打开本项后，这类调用会自动改用「同一枚 Bearer 令牌直连平台公网域」完成；
# 网关侧修好（转发 Authorization 头 / 把 baseUrl 指向公网域）之后可以关掉，
# 让链路回到纯 MCP。
direct_fallback = false
# 平台公网基址（仅直连兜底使用）
platform_base = https://lxyq.cssyq.com.cn

[business]
# ↓ 可选兜底值：当 sys-user-info / query-order 不可用时的静态兜底值。
#   能自动取到时命令行显式传入的值优先。留空即表示「完全不兜底」。
ddbh =
cpfwbh =
qdbm = 1033
product_id =
product_attr_unique =
