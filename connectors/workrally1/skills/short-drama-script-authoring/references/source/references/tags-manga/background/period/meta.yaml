- code: AP-ND01
  name: 年代细节穿帮
  severity: 高
  dimension: 标签与逻辑
  test: 服化道、物价、社会风貌严重失真，时代质感崩塌
- code: AP-ND02
  name: 时代机遇架空
  severity: 中
  dimension: 标签与逻辑
  test: 致富/逆袭脱离历史逻辑，凭空开挂违背年代背景
soft_warnings:
- 避免年代沦为背景板，仅换服装而无时代质感
- 避免价值观与时代脱节，过度现代化
- 避免苦难堆砌，缺乏向上的情感力量
manga:
  visual_signature: 年代街景/老物件 + 时代服化 + 怀旧色调
