<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="generator" content="PROPDB deterministic report renderer">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>{{PAGE_STYLE}}
{{STYLESHEET}}</style>
</head>
<body data-layout="{{LAYOUT}}" data-schema-version="{{SCHEMA_VERSION}}" data-template-version="{{TEMPLATE_VERSION}}">
  <a class="skip-link" href="#report-main">跳到报告正文</a>
  <article class="report-shell">
    <div class="report-topbar">
      <div class="brand-lockup">
        <img class="brand-logo" src="{{BRAND_LOGO_DATA_URI}}" alt="辛孚科技 Logo">
        <div class="brand-copy"><span class="brand-name">辛孚科技</span><span class="brand-product">PROPDB 物性数据库</span></div>
      </div>
      <span class="template-chip">PROPDB REPORT</span>
    </div>
{{HERO}}
    <main class="report-main" id="report-main">
{{MAIN_CONTENT}}
    </main>
  </article>
</body>
</html>
