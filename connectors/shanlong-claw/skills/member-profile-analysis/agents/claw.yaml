display_name: "会员-用户画像分析"
display_description: "仅支持 CRM8 客户使用；非 CRM8 客户使用没有数据。会员业务 Skill：使用固定用户画像接口 CLI 分析一批会员的基础指标、生日、年龄、性别、入会来源、消费频次、入会时长和星座分布。适用于用户问“分析本月新增会员的用户画像分布”“用户画像结构怎么样”。仅用于群体画像；不用于手机号、会员号、卡号等单个会员查询。当用户的本业务问题提到“整个集团”“集团视角”“不区分门店”或未指定门店时，仍按当前账号/当前上下文默认权限范围执行，不得仅因未指定门店而拒绝或改用其它 Skill。"
skill_type: "business"
skill_tag_level1: "official"
skill_tag_level2:
  - "member_marketing"
  - "business_decision"
routing:
