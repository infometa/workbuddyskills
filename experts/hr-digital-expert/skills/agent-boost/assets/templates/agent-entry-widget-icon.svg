<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Agent 入口挂件图标</title>
  <desc id="desc">适合作为应用网站智能 Agent 悬浮入口的动态机器人挂件图标。</desc>
  <defs>
    <radialGradient id="orb" cx="42%" cy="28%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.34" stop-color="#edf7ff"/>
      <stop offset="0.72" stop-color="#dff7ff"/>
      <stop offset="1" stop-color="#d7fff5"/>
    </radialGradient>
    <linearGradient id="ring" x1="34" y1="30" x2="214" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.48" stop-color="#31d7ff"/>
      <stop offset="1" stop-color="#32e6b8"/>
    </linearGradient>
    <linearGradient id="metal" x1="74" y1="56" x2="180" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#dfe8f1"/>
      <stop offset="0.76" stop-color="#aebaca"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="visor" x1="82" y1="92" x2="174" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#182333"/>
      <stop offset="0.56" stop-color="#070b12"/>
      <stop offset="1" stop-color="#25384d"/>
    </linearGradient>
    <linearGradient id="bubble" x1="150" y1="50" x2="222" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#22d7d0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#24415f" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      :root { color-scheme: light; }
      .float { animation: float 4.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .ring { stroke-dasharray: 18 14; animation: ring 5.8s linear infinite; transform-origin: 128px 128px; }
      .eye { animation: eye 2.1s ease-in-out infinite; }
      .dot { animation: typing 1.25s ease-in-out infinite; }
      .dot.d2 { animation-delay: .18s; }
      .dot.d3 { animation-delay: .36s; }
      .spark { animation: spark 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .spark.s2 { animation-delay: -.65s; }
      .spark.s3 { animation-delay: -1.1s; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
      @keyframes ring { from{stroke-dashoffset:0; transform:rotate(0deg)} to{stroke-dashoffset:-64; transform:rotate(360deg)} }
      @keyframes eye { 0%,100%{opacity:1; filter:none} 50%{opacity:.72; filter:drop-shadow(0 0 7px #34f6cf)} }
      @keyframes typing { 0%,80%,100%{opacity:.35; transform:translateY(0)} 40%{opacity:1; transform:translateY(-3px)} }
      @keyframes spark { 0%,100%{opacity:.35; transform:scale(.72) rotate(0deg)} 50%{opacity:1; transform:scale(1.12) rotate(12deg)} }
      @keyframes pulse { 0%,100%{transform:scale(1); opacity:.92} 50%{transform:scale(1.12); opacity:1} }
    </style>
  </defs>

  <circle cx="128" cy="128" r="102" fill="url(#orb)" filter="url(#shadow)"/>
  <circle class="ring" cx="128" cy="128" r="111" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <circle cx="72" cy="54" r="18" fill="#ffffff" opacity="0.78"/>
  <circle cx="194" cy="202" r="22" fill="#ffffff" opacity="0.5"/>

  <g class="float">
    <ellipse cx="128" cy="196" rx="56" ry="12" fill="#8ca4bd" opacity="0.24"/>

    <g filter="url(#shadow)">
      <path d="M75 91 L91 62 C96 53 109 56 111 67 L116 92 Z" fill="url(#metal)" stroke="#8797aa" stroke-width="4" stroke-linejoin="round"/>
      <path d="M140 92 L147 67 C150 56 163 53 168 62 L183 92 Z" fill="url(#metal)" stroke="#8797aa" stroke-width="4" stroke-linejoin="round"/>
      <rect x="66" y="82" width="124" height="82" rx="48" fill="url(#metal)" stroke="#93a3b6" stroke-width="4"/>
      <circle cx="63" cy="123" r="19" fill="url(#metal)" stroke="#758396" stroke-width="4"/>
      <circle cx="193" cy="123" r="19" fill="url(#metal)" stroke="#758396" stroke-width="4"/>
      <circle cx="63" cy="123" r="8" fill="#778596"/>
      <circle cx="193" cy="123" r="8" fill="#778596"/>
      <rect x="85" y="100" width="86" height="48" rx="24" fill="url(#visor)"/>
      <rect class="eye" x="109" y="112" width="9" height="25" rx="5" fill="#34f6cf" filter="url(#glow)"/>
      <rect class="eye" x="138" y="112" width="9" height="25" rx="5" fill="#34f6cf" filter="url(#glow)"/>
      <path d="M104 162 C99 184 111 198 130 199 C150 200 161 185 154 162 Z" fill="url(#metal)" stroke="#93a3b6" stroke-width="4"/>
      <path d="M104 175 C92 178 87 188 92 197" fill="none" stroke="#93a3b6" stroke-width="8" stroke-linecap="round"/>
      <path d="M154 175 C167 178 172 188 166 197" fill="none" stroke="#93a3b6" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="113" cy="204" rx="13" ry="9" fill="#111827"/>
      <ellipse cx="148" cy="204" rx="13" ry="9" fill="#111827"/>
    </g>

    <g transform="translate(156 48)" filter="url(#shadow)">
      <path d="M0 15 C0 6 7 0 16 0 H60 C69 0 76 7 76 16 V44 C76 53 69 60 60 60 H32 L18 74 L21 60 H16 C7 60 0 53 0 44 Z" fill="url(#bubble)"/>
      <circle class="dot" cx="27" cy="30" r="5" fill="#ffffff"/>
      <circle class="dot d2" cx="39" cy="30" r="5" fill="#ffffff"/>
      <circle class="dot d3" cx="51" cy="30" r="5" fill="#ffffff"/>
    </g>
  </g>

  <g class="pulse" filter="url(#shadow)">
    <circle cx="196" cy="58" r="17" fill="#ff5c7a"/>
    <circle cx="196" cy="58" r="7" fill="#ffffff" opacity="0.92"/>
  </g>

  <path class="spark" d="M43 110 l10 -16 l10 16 l-10 16 Z" fill="#ffd45a"/>
  <path class="spark s2" d="M206 152 l8 -13 l8 13 l-8 13 Z" fill="#2de1b6"/>
  <circle class="spark s3" cx="58" cy="181" r="7" fill="#735cff"/>
</svg>
