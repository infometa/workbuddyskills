<div class="pcf-section">
  <div class="pcf-section__metrics">
    {{#summary}}
    <div class="pcf-section__metric">
      <div class="pcf-section__metric-label">{{label}}</div>
      <div class="pcf-section__metric-value">{{value}}<span class="pcf-section__metric-unit">{{unit}}</span></div>
    </div>
    {{/summary}}
  </div>

  <h3>征信详情</h3>
  <div class="pcf-section__data-block">
    <table>
      <thead><tr><th>指标</th><th>数值</th></tr></thead>
      <tbody>
        {{#creditInfo}}
        <tr><td>{{label}}</td><td>{{value}}</td></tr>
        {{/creditInfo}}
      </tbody>
    </table>
  </div>

  <h3>融资历史</h3>
  <div class="pcf-section__data-block">
    <table>
      <thead><tr><th>类型</th><th>时间</th><th>金额</th><th>机构</th><th>状态</th></tr></thead>
      <tbody>
        {{#history}}
        <tr><td>{{type}}</td><td>{{time}}</td><td>{{amount}}</td><td>{{org}}</td><td>{{status}}</td></tr>
        {{/history}}
      </tbody>
    </table>
  </div>

  <div class="pcf-section__source">
    <div class="pcf-section__source-title">数据来源文件</div>
    <div class="pcf-section__source-list">
      {{#each sourceFiles}}
      <span class="pcf-section__source-item">{{this}}</span>
      {{/each}}
    </div>
  </div>
</div>
