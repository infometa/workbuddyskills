<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专家评审建议</title>
<style>
  :root{
    --teal:#0F4C5C; --teal2:#12707F; --teal-soft:#E3F0F2;
    --amber:#E8A33D; --amber-soft:#FBF0DC;
    --green:#15803D; --green-soft:#E3F4E8;
    --red:#C0563B; --red-soft:#F9E8E2;
    --ink:#1F2933; --grey:#5C6B73; --line:#E2E8EA; --bg:#F4F7F8; --card:#FFFFFF; --silver:#E5E9EC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; background:var(--bg); color:var(--ink); line-height:1.55;}
  .wrap{max-width:1080px; margin:0 auto; padding:18px 20px 60px;}
  .head{background:linear-gradient(120deg,var(--teal),var(--teal2)); color:#fff; border-radius:14px; padding:22px 26px;}
  .head .tag{display:inline-block; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); border-radius:999px; font-size:12px; padding:3px 12px; letter-spacing:.5px;}
  .head h1{font-size:26px; margin-top:10px; font-weight:800;}
  .head .sub{font-size:13px; opacity:.85; margin-top:4px;}
  .head .meta{margin-top:12px; font-size:12px; opacity:.75; display:flex; gap:16px; flex-wrap:wrap;}
  .summary{background:var(--card); border:1px solid var(--line); border-left:5px solid var(--amber); border-radius:12px; padding:14px 18px; margin-top:14px; font-size:14px;}
  .summary b{color:var(--teal);}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
  .card h2{font-size:15px; color:var(--teal); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .card h2 .num{background:var(--teal); color:#fff; font-size:11px; border-radius:6px; padding:2px 8px;}
  .radar-wrap{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .radar-wrap svg{flex:none;}
  .legend{flex:1; min-width:200px; font-size:13px;}
  .legend .row{display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .legend .dot{width:10px; height:10px; border-radius:3px; flex:none;}
  .legend .l-name{font-weight:600; min-width:60px;}
  .legend .l-score{font-weight:800; color:var(--teal); margin-left:auto;}
  .scorebar{display:grid; grid-template-columns:90px 1fr 42px; align-items:center; gap:10px; margin-top:9px;}
  .scorebar .s-name{font-size:13px; font-weight:600;}
  .scorebar .track{height:10px; background:var(--silver); border-radius:999px; overflow:hidden;}
  .scorebar .track i{display:block; height:100%; border-radius:999px;}
  .scorebar .s-val{font-size:13px; font-weight:800; text-align:right; color:var(--teal);}
  .c-low{background:var(--red);} .c-mid{background:var(--amber);} .c-hi{background:var(--green);} .c-teal{background:var(--teal2);}
  .weak-badge{display:inline-block; background:var(--red-soft); color:var(--red); font-size:12.5px; font-weight:700; border-radius:999px; padding:4px 14px; margin-top:12px;}
  .sug{border-radius:10px; padding:12px 14px; margin-top:10px; border:1.5px solid;}
  .sug.improve{background:var(--red-soft); border-color:var(--red);}
  .sug.consolidate{background:var(--green-soft); border-color:var(--green);}
  .sug .s-head{display:flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px;}
  .sug .s-tag{font-size:11px; border-radius:999px; padding:1px 9px; background:rgba(255,255,255,.75); color:var(--grey);}
  .sug.improve .s-head{color:var(--red);} .sug.consolidate .s-head{color:var(--green);}
  .sug .s-desc{font-size:12.5px; color:var(--ink); margin-top:5px; opacity:.9;}
  .chal{display:flex; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px; align-items:flex-start;}
  .chal .ic{flex:none; width:20px; height:20px; border-radius:50%; background:var(--amber-soft); color:#9A6A16; font-size:12px; display:flex; align-items:center; justify-content:center; font-weight:800;}
  .values{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  @media(max-width:900px){.values{grid-template-columns:1fr;}}
  .val{border:1.5px solid var(--line); border-radius:10px; padding:12px;}
  .val .v-t{font-size:12px; font-weight:700; color:var(--teal); margin-bottom:5px;}
  .val .v-d{font-size:12.5px; color:var(--ink);}
  .actions{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  @media(max-width:900px){.actions{grid-template-columns:1fr;}}
  .act{border:1.5px solid var(--teal2); border-radius:10px; padding:12px; background:var(--teal-soft);}
  .act .a-n{font-size:20px; font-weight:800; color:var(--teal2);}
  .act .a-t{font-size:13px; font-weight:700; margin-top:2px;}
  .foot-note{margin-top:16px; font-size:12px; color:var(--grey); text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <div class="head" id="headBox"></div>

  <div class="summary" id="summaryBox"></div>

  <div class="grid">
    <div class="card">
      <h2><span class="num">01</span>五关诊断雷达</h2>
      <div class="radar-wrap">
        <svg id="radar" width="330" height="300" viewBox="0 0 330 300"></svg>
        <div class="legend" id="legend"></div>
      </div>
      <div id="weakBox"></div>
    </div>

    <div class="card">
      <h2><span class="num">02</span>五关评分</h2>
      <div id="bars"></div>
      <div id="verdicts" style="margin-top:10px; font-size:12.5px; color:var(--grey);"></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2><span class="num">03</span>改进建议 <span style="font-weight:400;font-size:12px;color:var(--grey);margin-left:auto;">改进型 = 影响落地，必须做</span></h2>
      <div id="improveBox"></div>
      <h2 style="margin-top:16px;"><span class="num">04</span>巩固建议 <span style="font-weight:400;font-size:12px;color:var(--grey);margin-left:auto;">巩固型 = 锦上添花</span></h2>
      <div id="consolidateBox"></div>
    </div>

    <div>
      <div class="card">
        <h2><span class="num">05</span>评委最可能质疑的点</h2>
        <div id="chalBox"></div>
      </div>
      <div class="card" style="margin-top:16px;">
        <h2><span class="num">06</span>三层价值</h2>
        <div class="values" id="valBox"></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2><span class="num">07</span>下一步行动</h2>
    <div class="actions" id="actBox"></div>
  </div>

  <div class="foot-note">本页为专家评审建议 · 由「青创领航员」专家生成 · 评审结论可随项目进展更新</div>
</div>

<script>
window.__VIS__ = __WB_DATA__;
(function(){
  const D = window.__VIS__;
  const GATES = D.gates || [];

  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function colorOf(s){ return s<40?'var(--red)':(s<70?'var(--amber)':'var(--green)'); }

  document.getElementById('headBox').innerHTML =
    '<span class="tag">专家评审建议 · 由「青创领航员」专家生成</span>'+
    '<h1>'+esc(D.project||'')+'</h1>'+
    '<div class="sub">'+esc(D.subtitle||'专家评审建议')+'</div>'+
    '<div class="meta">'+(D.meta||[]).map(m=>'<span>🏷 '+esc(m.k)+'：'+esc(m.v)+'</span>').join('')+
    (D.date?('<span>📅 '+esc(D.date)+'</span>'):'')+'</div>';

  document.getElementById('summaryBox').innerHTML = '<b>总体诊断：</b>'+esc(D.summary||'');
  document.title = (D.project||'项目')+' · 专家评审建议';

  // ---- radar ----
  (function drawRadar(){
    const svg = document.getElementById('radar');
    const NS='http://www.w3.org/2000/svg';
    const cx=165, cy=145, R=105, n=GATES.length;
    const ang=i=>(-90 + i*360/n)*Math.PI/180;
    const pt=(i,r)=>[cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];
    let out='';
    for(let l=1;l<=4;l++){
      const rr=R*l/4;
      const pts=[]; for(let i=0;i<n;i++) pts.push(pt(i,rr).join(','));
      out+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="#E2E8EA" stroke-width="1"/>';
    }
    for(let i=0;i<n;i++){
      const p=pt(i,R);
      out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#E2E8EA" stroke-width="1"/>';
      const lab=pt(i,R+18);
      out+='<text x="'+lab[0]+'" y="'+lab[1]+'" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#5C6B73" font-weight="600">'+esc(GATES[i].name)+'</text>';
    }
    const dataPts=[]; for(let i=0;i<n;i++) dataPts.push(pt(i, R*(Math.min(100,Math.max(0,GATES[i].score||0))/100)).join(','));
    out+='<polygon points="'+dataPts.join(' ')+'" fill="rgba(18,112,127,.25)" stroke="#12707F" stroke-width="2"/>';
    for(let i=0;i<n;i++){ const p=pt(i,R*(Math.min(100,Math.max(0,GATES[i].score||0))/100)); out+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#12707F"/>'; }
    svg.innerHTML=out;
  })();

  document.getElementById('legend').innerHTML = GATES.map(g=>{
    const s=Math.min(100,Math.max(0,g.score||0));
    return '<div class="row"><span class="dot" style="background:'+colorOf(s)+'"></span><span class="l-name">'+esc(g.name)+'</span><span class="l-score">'+s+'</span></div>';
  }).join('');

  if(D.weakest){
    document.getElementById('weakBox').innerHTML = '<span class="weak-badge">⚠ 最弱关：'+esc(D.weakest)+' —— 优先攻坚</span>';
  }

  document.getElementById('bars').innerHTML = GATES.map(g=>{
    const s=Math.min(100,Math.max(0,g.score||0));
    return '<div class="scorebar"><span class="s-name">'+esc(g.name)+'</span><div class="track"><i style="width:'+s+'%;background:'+colorOf(s)+'"></i></div><span class="s-val">'+s+'</span></div>';
  }).join('');

  document.getElementById('verdicts').innerHTML = (D.verdicts||[]).map(v=>'<div style="padding:6px 0;border-bottom:1px dashed var(--line);"><b>'+esc(v.gate)+'（'+esc(v.level||'')+'）：</b>'+esc(v.comment||'')+'</div>').join('');

  document.getElementById('improveBox').innerHTML = (D.improve||[]).map(s=>'<div class="sug improve"><div class="s-head">🔧 '+esc(s.title)+'<span class="s-tag">'+esc(s.gate||'')+'</span></div><div class="s-desc">'+esc(s.desc||'')+'</div></div>').join('') || '<div style="color:var(--grey);font-size:13px;">暂无</div>';

  document.getElementById('consolidateBox').innerHTML = (D.consolidate||[]).map(s=>'<div class="sug consolidate"><div class="s-head">✨ '+esc(s.title)+'<span class="s-tag">'+esc(s.gate||'')+'</span></div><div class="s-desc">'+esc(s.desc||'')+'</div></div>').join('') || '<div style="color:var(--grey);font-size:13px;">暂无</div>';

  document.getElementById('chalBox').innerHTML = (D.challenges||[]).map(c=>'<div class="chal"><span class="ic">!</span><span>'+esc(c)+'</span></div>').join('') || '<div style="color:var(--grey);font-size:13px;">暂无</div>';

  const V=D.values||{};
  document.getElementById('valBox').innerHTML =
    '<div class="val"><div class="v-t">技术价值</div><div class="v-d">'+esc(V.技术||V.tech||'—')+'</div></div>'+
    '<div class="val"><div class="v-t">商业价值</div><div class="v-d">'+esc(V.商业||V.biz||'—')+'</div></div>'+
    '<div class="val"><div class="v-t">社会价值</div><div class="v-d">'+esc(V.社会||V.social||'—')+'</div></div>';

  document.getElementById('actBox').innerHTML = (D.actions||[]).map((a,i)=>'<div class="act"><div class="a-n">'+(i+1)+'</div><div class="a-t">'+esc(a)+'</div></div>').join('');
})();
</script>
</body>
</html>
