    origin: "Russia-linked (RaaS)"
    description: "LockBit 是最活跃的 RaaS 勒索家族之一，以高加密速度和自动化横向传播著称。"
    extensions:
      - ".lockbit"
      - ".lockbit3"
      - ".abcd"
