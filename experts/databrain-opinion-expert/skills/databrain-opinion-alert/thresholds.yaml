# 商店评分告警阈值表
# ----------------------------------------------------------------------------
# 1) defaults：按「舆情告警一期 模板」§1.2.1 / §1.2.2 复刻 P0/P1/P2 三档基线
# 2) overrides：按 game_id 覆盖，支持单字段深合并（仅写要改的字段，其余沿默认）
# 3) baseline：取值字符串 → p5 / p25 / median_7d，含义见 references/store_score_alert.md
# 4) silence_seconds：单点游戏单切片在静默期内不重复告警；升级（如 P1→P0）打破静默
# ----------------------------------------------------------------------------

# 切片评估开关 + 排除清单
# Steam 固定按语言切片：全球聚合 + 官方支持语种优先 + 可选自定义语种。
# language_priority / custom_languages 可写标准代码（如 EN / ZH-CN / PT-BR）或
# store_score_steam.language_reviews 原始 key（如 "English" / "Simplified Chinese"）。
# Google Play / App Store 仍按国家/地区切片。
slicing:
  steam:
    by_language: true
    language_priority: [EN, JA, KO, ZH-CN, DE, FR, RU, ES, PT-BR]
    custom_languages: []           # 自定义语种维度，按需追加到 priority 后
    include_unlisted_languages: true # true=priority/custom 之外的语种也继续评估，排在最后
    exclude_languages: []          # 可写标准代码或 language_reviews 原始 key
  google_play:
    by_country: true
    exclude_areas: []              # store_score_google_play_daily.area；按需加 'lang_te' 等伪国家码
  app_store:
    by_country: true
    exclude_areas: []

# 静默期（秒）。当前等级序号 < 上次（P0=0/P1=1/P2=2）→ 升级 → 立即打破
silence_seconds:
  P0: 3600        # 1h
  P1: 7200        # 2h
  P2: 21600       # 6h

# ============================================================
# defaults：默认阈值
# 字段语义：
#   absolute_pp     好评率绝对水位（百分比，仅 steam）
#   absolute_score  评分绝对水位（0~5，仅 google_play / app_store）
#   one_star_rate   1 星占比绝对水位（0~1，仅 google_play / app_store）
#   drop_6h_pp      6h 内好评率下跌（百分点，仅 steam）
#   drop_24h_pp     24h 内好评率下跌（百分点，仅 steam）
#   drop_6h         6h 内评分下跌（绝对值，仅 google_play / app_store）
#   drop_24h        24h 内评分下跌（绝对值，仅 google_play / app_store）
#   baseline        历史基准比较口径：p5 / p25 / median_7d
#                     p5/p25       = 当前值低于 30 天分布的第 5/25 百分位
#                     median_7d    = 当前值低于过去 7 天中位数
#   min_sample      样本量门槛硬条件，不达标则该等级一律不触发
# 注：四个维度（A 绝对水位 / B 相对下跌 / C 历史基准 / 样本量）任一命中且样本量达标 → 该等级触发
# ============================================================
defaults:
  steam:
    all_reviews:    # 历史累计好评率（store_score_steam.all_reviews_score）
      P0: { absolute_pp: 60, drop_6h_pp: 5, baseline: p5,        min_sample: 100 }
      P1: { absolute_pp: 75, drop_6h_pp: 2, baseline: p25,       min_sample: 50  }
      P2: { absolute_pp: 80, drop_24h_pp: 1, baseline: median_7d, min_sample: 20  }
    recent_reviews: # 近期好评率（store_score_steam.recent_reviews_score）
      P0: { absolute_pp: 60, drop_6h_pp: 5, baseline: p5,        min_sample: 100 }
      P1: { absolute_pp: 75, drop_6h_pp: 2, baseline: p25,       min_sample: 50  }
      P2: { absolute_pp: 80, drop_24h_pp: 1, baseline: median_7d, min_sample: 20  }

  google_play:
    P0: { absolute_score: 3.0, one_star_rate: 0.40, drop_6h: 0.3,  baseline: p5,        min_sample: 200 }
    P1: { absolute_score: 3.5, one_star_rate: 0.25, drop_6h: 0.1,  baseline: p25,       min_sample: 100 }
    P2: { absolute_score: 4.0,                     drop_24h: 0.05, baseline: median_7d, min_sample: 50  }

  app_store:
    # 按 area 独立运行，不做全球均分（详见模板特别说明）
    P0: { absolute_score: 3.0, one_star_rate: 0.40, drop_6h: 0.3,  baseline: p5,        min_sample: 200 }
    P1: { absolute_score: 3.5, one_star_rate: 0.25, drop_6h: 0.1,  baseline: p25,       min_sample: 100 }
    P2: { absolute_score: 4.0,                     drop_24h: 0.05, baseline: median_7d, min_sample: 50  }

# ============================================================
# overrides：按 game_id 覆盖（深合并，仅写要改的字段）
# 示例（取消注释即可生效）：
#
# overrides:
#   e7f672beaa5fddd166df98bc046ba4bd4:    # POE2
#     steam:
#       all_reviews:
#         P0: { absolute_pp: 55 }         # 仅覆盖 P0.absolute_pp，其它字段沿用默认
#   uef4312b08dde07820374dd57086ea2fb:    # NIKKE
#     google_play:
#       P0: { min_sample: 100 }           # 体量较小，降样本量门槛
# ============================================================
overrides: {}
