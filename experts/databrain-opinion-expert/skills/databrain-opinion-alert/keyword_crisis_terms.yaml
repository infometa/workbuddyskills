# Keyword crisis term taxonomy used by scripts/check_alerts.py.
# Terms are intentionally small and explicit; ops can extend variants during review.
categories:
  cheat:
    label: 外挂作弊
    default_level: P1
    terms:
      - 外挂
      - cheater
      - hacker
      - aimbot
      - wallhack
  ban:
    label: 封号争议
    default_level: P1
    terms:
      - 封号
      - 误封
      - ban
      - wrongful ban
      - appeal
  payment:
    label: 付费争议
    default_level: P1
    terms:
      - 氪金
      - P2W
      - scam
      - refund
      - 诱导消费
  data_security:
    label: 数据安全
    default_level: P0
    terms:
      - 删档
      - account hacked
      - data breach
      - 盗号
  shutdown:
    label: 停服跑路
    default_level: P0
    terms:
      - 停服
      - shutdown
      - EOS
      - dead game
  legal:
    label: 法律舆论
    default_level: P0
    terms:
      - lawsuit
      - 起诉
      - class action
      - 监管
