<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1056" width="680" height="1056">
  <defs>
    <style>
      .bg { fill: #FAFBFC; }
      .card { fill: #FFFFFF; stroke: #E0E2E6; stroke-width: 0.8; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; fill: #1F2328; }
      .subtitle { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #666A70; }
      .section-title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #1F2328; }
      .legend-text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #3D4248; }
      .card-title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; }
      .card-body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
      .card-note { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #666A70; }
      .date-left { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; fill: #666A70; text-anchor: end; }
      .tag-right { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; fill: #888780; text-anchor: end; }
      .tip-text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #5C3D05; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="1180"/>
  <g transform="scale(0.8947368)">
  <text x="380" y="50" text-anchor="middle" class="title">南非中资制造企业 2026/27 合规申报时间线</text>
  <text x="380" y="78" text-anchor="middle" class="subtitle">SARS 税年 2026.3.1 — 2027.2.28 | 数据截止 2026-07-28</text>

  <circle cx="60" cy="112" r="6" fill="#378ADD"/>
  <text x="76" y="116" class="legend-text">SARS 税务</text>
  <circle cx="180" cy="112" r="6" fill="#1D9E75"/>
  <text x="196" y="116" class="legend-text">社保工伤</text>
  <circle cx="300" cy="112" r="6" fill="#EF9F27"/>
  <text x="316" y="116" class="legend-text">技能发展</text>
  <circle cx="420" cy="112" r="6" fill="#D85A30"/>
  <text x="436" y="116" class="legend-text">就业公平</text>
  <circle cx="540" cy="112" r="6" fill="#888780"/>
  <text x="556" y="116" class="legend-text">公司行政</text>

  <text x="30" y="160" class="section-title">全年月度循环</text>

  <rect class="card" x="30" y="175" width="220" height="90" rx="10"/>
  <text x="45" y="200" class="card-title" fill="#378ADD">每月 7 日前</text>
  <text x="45" y="222" class="card-body" fill="#1F2328">EMP201: PAYE+UIF+SDL</text>
  <text x="45" y="240" class="card-note">SARS eFiling</text>

  <rect class="card" x="270" y="175" width="220" height="90" rx="10"/>
  <text x="285" y="200" class="card-title" fill="#1D9E75">实时（入离职时）</text>
  <text x="285" y="222" class="card-body" fill="#1F2328">UI-19 雇员变动申报</text>
  <text x="285" y="240" class="card-note">DOL / uFiling</text>

  <rect class="card" x="510" y="175" width="220" height="90" rx="10"/>
  <text x="525" y="200" class="card-title" fill="#378ADD">VAT 申报</text>
  <text x="525" y="222" class="card-body" fill="#1F2328">VAT201（依 SARS 类别）</text>
  <text x="525" y="240" class="card-note">SARS</text>

  <text x="30" y="300" class="section-title">年度关键节点</text>
  <line x1="110" y1="325" x2="110" y2="920" stroke="#D0D4DA" stroke-width="2"/>

  <circle cx="110" cy="340" r="6" fill="#1D9E75"/>
  <text x="95" y="344" class="date-left">年度</text>
  <rect class="card" x="130" y="318" width="580" height="44" rx="8"/>
  <text x="145" y="338" class="card-title" fill="#1D9E75">OHSA 年度报告</text>
  <text x="230" y="338" class="card-body" fill="#1F2328">工伤事故统计（以 DoEL 为准）</text>
  <text x="690" y="338" class="tag-right">DEL</text>

  <circle cx="110" cy="395" r="6" fill="#1D9E75"/>
  <text x="95" y="399" class="date-left">4/1</text>
  <rect class="card" x="130" y="373" width="580" height="44" rx="8"/>
  <text x="145" y="393" class="card-title" fill="#1D9E75">4/1—6/30</text>
  <text x="230" y="393" class="card-body" fill="#1F2328">COIDA ROE 工伤赔偿年度申报窗口（制造业费率 ~1%-3%）</text>
  <text x="690" y="393" class="tag-right">Comp Fund</text>

  <circle cx="110" cy="450" r="6" fill="#EF9F27"/>
  <text x="95" y="454" class="date-left">4/30</text>
  <rect class="card" x="130" y="428" width="580" height="44" rx="8"/>
  <text x="145" y="448" class="card-title" fill="#EF9F27">4月30日</text>
  <text x="230" y="448" class="card-body" fill="#1F2328">WSP/ATR 技能计划与培训报告 → merSETA（影响 B-BBEE 技能要素）</text>
  <text x="690" y="448" class="tag-right">SETA</text>

  <circle cx="110" cy="505" r="6" fill="#378ADD"/>
  <text x="95" y="509" class="date-left">5/31</text>
  <rect class="card" x="130" y="483" width="580" height="44" rx="8"/>
  <text x="145" y="503" class="card-title" fill="#378ADD">5月31日</text>
  <text x="230" y="503" class="card-body" fill="#1F2328">EMP501 年度对账 + IRP5/IT3(a) 证书发放（须含员工税号）</text>
  <text x="690" y="503" class="tag-right">SARS</text>

  <circle cx="110" cy="560" r="6" fill="#D85A30"/>
  <text x="95" y="564" class="date-left">9/1</text>
  <rect class="card" x="130" y="538" width="580" height="44" rx="8"/>
  <text x="145" y="558" class="card-title" fill="#D85A30">9月1日</text>
  <text x="230" y="558" class="card-body" fill="#1F2328">EEA2/EEA4 就业公平报告季开启（50+人指定雇主强制）</text>
  <text x="690" y="558" class="tag-right">DEL</text>

  <circle cx="110" cy="615" r="6" fill="#D85A30"/>
  <text x="95" y="619" class="date-left">10/1</text>
  <rect class="card" x="130" y="593" width="580" height="44" rx="8"/>
  <text x="145" y="613" class="card-title" fill="#D85A30">10月1日</text>
  <text x="230" y="613" class="card-body" fill="#1F2328">EEA2/EEA4 纸质提交截止（仅首工作日窗口）</text>
  <text x="690" y="613" class="tag-right">DEL</text>

  <circle cx="110" cy="670" r="6" fill="#378ADD"/>
  <text x="95" y="674" class="date-left">10/31</text>
  <rect class="card" x="130" y="648" width="580" height="44" rx="8"/>
  <text x="145" y="668" class="card-title" fill="#378ADD">10月31日</text>
  <text x="230" y="668" class="card-body" fill="#1F2328">EMP501 中期对账（3月-8月期）+ IRP5/IT3(a)</text>
  <text x="690" y="668" class="tag-right">SARS</text>

  <circle cx="110" cy="725" r="6" fill="#D85A30"/>
  <text x="95" y="729" class="date-left">1/15</text>
  <rect class="card" x="130" y="703" width="580" height="44" rx="8"/>
  <text x="145" y="723" class="card-title" fill="#D85A30">2027/1/15</text>
  <text x="230" y="723" class="card-body" fill="#1F2328">EEA2/EEA4 电子提交最终截止（罚则最高 R2.7M 或 10% 营业额）</text>
  <text x="690" y="723" class="tag-right">DEL</text>

  <circle cx="110" cy="780" r="6" fill="#378ADD"/>
  <text x="95" y="784" class="date-left">2/28</text>
  <rect class="card" x="130" y="758" width="580" height="44" rx="8"/>
  <text x="145" y="778" class="card-title" fill="#378ADD">2027/2/28</text>
  <text x="230" y="778" class="card-body" fill="#1F2328">2026/27 税年结束（次年 5/31 完成该期 EMP501）</text>
  <text x="690" y="778" class="tag-right">SARS</text>

  <text x="30" y="845" class="section-title">滚动节点（全年有效）</text>

  <rect class="card" x="30" y="860" width="340" height="75" rx="10"/>
  <text x="45" y="885" class="card-title" fill="#888780">CIPC 年度申报</text>
  <text x="45" y="907" class="card-body" fill="#1F2328">成立周年日后 30 工作日内</text>
  <text x="45" y="925" class="card-note">连续 2 年未报 → 注销</text>

  <rect class="card" x="390" y="860" width="340" height="75" rx="10"/>
  <text x="405" y="885" class="card-title" fill="#888780">B-BBEE 合规证书（Section 53）</text>
  <text x="405" y="907" class="card-body" fill="#1F2328">12 个月有效期</text>
  <text x="405" y="925" class="card-note">政府合同 / 国企业务硬性前提</text>

  <rect x="30" y="960" width="700" height="50" rx="8" fill="#FEF3DD" stroke="#EF9F27" stroke-width="0.8"/>
  <text x="380" y="990" text-anchor="middle" class="tip-text">制造业提示：COIDA 费率 ~1%-3%（中风险）| WSP/ATR 提至 merSETA | 50+ 人即 EE 指定雇主 | 薪酬总额 &gt;R500k 须缴 SDL</text>

  <text x="380" y="1050" text-anchor="middle" class="subtitle">注：3月19-31日 ROE 在线系统临时关闭 · 制造业 COIDA 费率约 1%-3% · 50人以上企业适用 EEA2/EEA4</text>
  <text x="380" y="1075" text-anchor="middle" class="subtitle">数据来源：SARS / DEL / Compensation Fund / CIPC · 检索日期 2026-07-28 · 以上截止日期以官网当期公告为准</text>
  </g>
</svg>